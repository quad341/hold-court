name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            container: ""
          - name: macos
            os: macos-latest
            container: ""
          - name: ubuntu-fedora
            os: ubuntu-latest
            container: "fedora:latest"
    steps:
      - name: Install prerequisites (Fedora container only)
        if: matrix.container != ''
        run: |
          dnf install -y git tar gzip gcc make
          git config --global --add safe.directory "*"

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Check formatting
        run: make fmt-check

      - name: Test with race detector
        run: make test-race

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
